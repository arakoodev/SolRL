[package]
name = "solrl-registry"
version = "0.1.0"
edition = "2021"
description = "SolRL EnclaveRegistry and settlement hook program"

[lib]
crate-type = ["cdylib", "lib"]
name = "solrl_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
solana-program = { workspace = true }
solrl-claim = { path = "../../crates/solrl-claim" }
spl-token-2022 = { version = "3.0.5", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "0.6.5"
spl-tlv-account-resolution = "0.6.5"
