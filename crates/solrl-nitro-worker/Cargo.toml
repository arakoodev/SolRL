[package]
name = "solrl-nitro-worker"
version = "0.1.0"
edition = "2021"
description = "Minimal SolRL AWS Nitro NSM attestation worker"

[workspace]

[dependencies]
aws-nitro-enclaves-nsm-api = "0.4.0"
libc = "0.2"
serde_bytes = "0.11"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
